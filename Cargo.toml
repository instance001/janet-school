[package]
name = "janet-school-rs"
version = "0.1.0"
edition = "2024"
description = "Standalone Janet School research rig published under Fractal Media Infrastructure."
license = "AGPL-3.0-or-later"
repository = "https://github.com/Instance001/janet-school"
homepage = "https://github.com/Instance001/janet-school"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schemars = { version = "1.0.4", features = ["chrono04", "uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
